# INTENTIONALLY INSECURE TRAINING FIXTURE. DO NOT DEPLOY.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-devops-portfolio-vulnerable-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-devops-portfolio-vulnerable-demo
  template:
    metadata:
      labels:
        app: agentic-devops-portfolio-vulnerable-demo
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: portfolio
          image: agentic-devops-portfolio:vulnerable-demo
          imagePullPolicy: Always
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
          ports:
            - containerPort: 80
