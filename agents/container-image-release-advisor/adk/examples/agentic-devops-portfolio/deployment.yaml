apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-devops-portfolio
  labels:
    app.kubernetes.io/name: agentic-devops-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-devops-portfolio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-devops-portfolio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portfolio
          # Replace this example digest with the digest produced by the release pipeline.
          image: docker.io/example/agentic-devops-portfolio@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-temporary-files
              mountPath: /tmp
      volumes:
        - name: nginx-temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
