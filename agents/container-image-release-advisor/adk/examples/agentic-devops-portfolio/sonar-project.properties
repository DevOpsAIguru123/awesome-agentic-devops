sonar.projectKey=awesome-agentic-devops-container-image-advisor
sonar.projectName=Awesome Agentic DevOps - Container Image Release Advisor
sonar.projectVersion=1.0
sonar.sources=scripts
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml
# Provider transport and report-rendering adapters are exercised by the hosted
# workflow. The 80% unit-coverage gate is scoped to deterministic policy,
# aggregation, and Trivy triage; every script remains in sonar.sources.
sonar.coverage.exclusions=scripts/deliver_security_report.py,scripts/export_sonar.py,scripts/render_security_report.py,scripts/render_workflow_summary.py
sonar.exclusions=reports/**,.scannerwork/**,.ci-config-scan/**
