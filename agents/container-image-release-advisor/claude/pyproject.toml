[project]
name = "claude-container-hardening"
version = "0.1.0"
description = "Tool-disabled Claude Agent SDK advisory for sanitized Trivy evidence."
requires-python = ">=3.11,<3.14"
dependencies = [
    "claude-agent-sdk==0.1.53",
    "pydantic>=2.12.5,<3.0.0",
]

[project.scripts]
claude-container-review = "claude_container_hardening.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.16.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_container_hardening"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "I", "RUF", "UP", "W"]
